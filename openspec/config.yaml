schema: spec-driven

context: |
  App name: Amigo Presente (gift list and secret santa app for web and mobile).
  Write all artifacts in English.
  The term "app" is used in a general sense; when specific, use "webapp" or "mobileapp".
  Current phase: API + Blazor webapp only; the .NET MAUI mobileapp is deferred, but architecture must stay mobile-ready.
  Tech stack: C#/.NET 10, ASP.NET Core Web API, Blazor webapp, shared Razor Class Library.
  Architecture: Clean Architecture and SOLID principles.
  Main database: SQL Server with EF Core. Connection string from environment variable "MainDatabaseConnectionString".
  The API + main database are the only source of truth.
  Frontend: Bootstrap v5.3.9 and Bootstrap Icons v1.13.2 (icon font) and emoji support.
  Localization: .resx + IStringLocalizer<T> in the shared RCL.
  CI/CD: GitHub Actions deploying to Azure App Service.

rules:
  proposal:
    - Keep proposals under 500 words
  design:
    - If change affects database schema, describe entities/columns affected and required EF Core migration
    - For UI changes, use `prompts/reference.html` ONLY as a layout and visual style reference, not for content, behavior, or structure
  tasks:
    - Break tasks into chunks of max 30 minutes
    - Any database schema change must include a task to create the EF Core migration and review generated code
    - Any task that adds user-visible text must add it to .resx resources; no hardcoded UI strings

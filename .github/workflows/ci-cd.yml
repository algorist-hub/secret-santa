name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AlgoristSecretSanta.slnx

      - name: Build
        run: dotnet build AlgoristSecretSanta.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution AlgoristSecretSanta.slnx --configuration Release --no-build

      - name: Publish server application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/Algorist.Api/Algorist.Api.csproj --configuration Release --output ${{ runner.temp }}/publish

      - name: Upload publish output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: algorist-api
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login to Azure
    steps:
      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: algorist-api
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
